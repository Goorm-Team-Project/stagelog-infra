name: Deploy Auth Lambda

on:
  workflow_dispatch:
    inputs:
      auth_lambda_s3_key:
        description: S3 key for auth API lambda artifact
        required: true
        type: string
      auth_lambda_s3_object_version:
        description: S3 object version for auth API lambda artifact
        required: false
        type: string
      authorizer_lambda_s3_key:
        description: S3 key for authorizer lambda artifact
        required: true
        type: string
      authorizer_lambda_s3_object_version:
        description: S3 object version for authorizer lambda artifact
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1-permanent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_auth_lambda_s3_key: ${{ inputs.auth_lambda_s3_key }}
          TF_VAR_auth_lambda_s3_object_version: ${{ inputs.auth_lambda_s3_object_version }}
          TF_VAR_authorizer_lambda_s3_key: ${{ inputs.authorizer_lambda_s3_key }}
          TF_VAR_authorizer_lambda_s3_object_version: ${{ inputs.authorizer_lambda_s3_object_version }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: terraform plan -input=false

      - name: Terraform apply
        env:
          TF_VAR_auth_lambda_s3_key: ${{ inputs.auth_lambda_s3_key }}
          TF_VAR_auth_lambda_s3_object_version: ${{ inputs.auth_lambda_s3_object_version }}
          TF_VAR_authorizer_lambda_s3_key: ${{ inputs.authorizer_lambda_s3_key }}
          TF_VAR_authorizer_lambda_s3_object_version: ${{ inputs.authorizer_lambda_s3_object_version }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: terraform apply -input=false -auto-approve
